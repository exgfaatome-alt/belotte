name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recupérer le code
        uses: actions/checkout@v4

      - name: Installer Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer les outils Android (AAPT, Zipalign, Apksigner, etc.)
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt zipalign apksigner default-jdk

      - name: Rendre le script exécutable et le lancer
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Sauvegarder l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: BeloteDuSoir
          path: build/BeloteDuSoir.apk
