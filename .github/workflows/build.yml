name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer les composants SDK (Platform & Build-Tools)
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Rendre le script exécutable et le lancer
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Sauvegarder l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: BeloteDuSoir
          path: build/BeloteDuSoir.apk
